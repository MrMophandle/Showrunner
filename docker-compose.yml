# One `docker compose up` (2.5): the app container plus the mounted library volume.
services:
  app:
    build: .
    image: showrunner
    container_name: showrunner
    ports:
      - '4455:4455'
    volumes:
      # D2 — the SQLite file and every artifact live on the host, human-readable
      # and git-versionable. Compose creates ./library if it isn't there.
      - ./library:/app/library
    environment:
      PORT: '4455'
      LIBRARY_DIR: /app/library
      # D6's two backends, from your shell. Without these lines the container could not
      # reach a model at all and did not say so: `choose.ts` picks the `claude` CLI
      # whenever there is no key — right on Ryan's Mac, wrong in an image that has no
      # `claude` binary in it — and the failure landed on the first LLM call, inside a
      # step, mid-run. Now the key comes through, and when nothing can reach a model the
      # process says so at boot and on /api/health rather than at the worst moment.
      #
      # `:-` means "empty when unset", which is what both readers already treat as unset.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SHOWRUNNER_LLM_BACKEND: ${SHOWRUNNER_LLM_BACKEND:-}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4455/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
